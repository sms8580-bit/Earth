<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Live CCTV Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+KR:wght@300;400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #08080a;
            --sidebar-color: rgba(18, 18, 24, 0.7);
            --card-color: rgba(25, 25, 35, 0.45);
            --accent-color: #ff0055;
            --accent-glow: rgba(255, 0, 85, 0.4);
            --accent-blue: #0088ff;
            --accent-blue-glow: rgba(0, 136, 255, 0.3);
            --text-primary: #ffffff;
            --text-secondary: #9f9fa9;
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-border-active: rgba(255, 0, 85, 0.3);
            --transition-speed: 0.25s;
            --live-color: #00ff88;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background: radial-gradient(circle at 30% 0%, #151528, #08080a 70%);
        }

        /* Ambient Blobs */
        .blob {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            filter: blur(120px);
            z-index: 1;
            opacity: 0.12;
            pointer-events: none;
        }

        .blob-1 {
            top: -250px;
            left: -200px;
        }

        .blob-2 {
            bottom: -250px;
            right: -200px;
        }

        /* Main Layout */
        .app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            position: relative;
        }

        @media (max-width: 1024px) {
            .app-container {
                flex-direction: column;
                height: auto;
            }
        }

        /* Sidebar styling */
        .sidebar {
            width: 380px;
            background: var(--sidebar-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            padding: 1.8rem;
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            height: 100%;
            overflow-y: auto;
        }

        @media (max-width: 1024px) {
            .sidebar {
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid var(--glass-border);
            }
        }

        .logo-area h1 {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #ffffff, #a0a0ab);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.2rem;
        }

        .logo-area p {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Info & Status Badges */
        .status-panel {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .badge {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--live-color);
            box-shadow: 0 0 8px var(--live-color);
            animation: pulse 1.5s infinite;
        }

        /* Settings Card Group */
        .settings-section {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .control-group {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .form-row {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-row label {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        select,
        input[type="text"] {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            padding: 0.5rem 0.8rem;
            color: var(--text-primary);
            font-size: 0.85rem;
            outline: none;
            transition: border-color var(--transition-speed);
        }

        select:focus,
        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        button {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 0.5rem 0.8rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all var(--transition-speed);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        button.btn-accent {
            background: var(--accent-color);
        }

        button.btn-outline {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
        }

        button.btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--text-secondary);
        }

        /* Preset Library Panel */
        .preset-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 0.2rem;
        }

        .preset-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            padding: 0.6rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all var(--transition-speed);
        }

        .preset-item:hover {
            background: rgba(0, 136, 255, 0.1);
            border-color: var(--accent-blue);
            padding-left: 1rem;
        }

        .preset-item span.loc {
            font-weight: 600;
        }

        .preset-item span.action {
            font-size: 0.7rem;
            color: var(--accent-blue);
            opacity: 0;
            transition: opacity var(--transition-speed);
        }

        .preset-item:hover span.action {
            opacity: 1;
        }

        /* Active Slot Focus Panel */
        .active-slot-panel {
            border: 1px solid var(--glass-border-active);
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.05);
        }

        /* Main Dashboard Content Area */
        .main-content {
            flex: 1;
            padding: 1.8rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            height: 100%;
            overflow-y: auto;
        }

        @media (max-width: 1024px) {
            .main-content {
                height: auto;
                overflow-y: visible;
            }
        }

        .grid-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .grid-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        /* Dynamic CCTV Monitor Grid */
        .monitor-grid {
            display: grid;
            gap: 1rem;
            width: 100%;
            flex: 1;
            align-content: start;
        }

        /* Grid configurations mapping */
        .grid-2 {
            grid-template-columns: repeat(2, 1fr);
        }

        .grid-4 {
            grid-template-columns: repeat(2, 1fr);
        }

        .grid-6 {
            grid-template-columns: repeat(3, 1fr);
        }

        .grid-8 {
            grid-template-columns: repeat(4, 1fr);
        }

        .grid-9 {
            grid-template-columns: repeat(3, 1fr);
        }

        .grid-12 {
            grid-template-columns: repeat(4, 1fr);
        }

        .grid-16 {
            grid-template-columns: repeat(4, 1fr);
        }

        @media (max-width: 1280px) {

            .grid-6,
            .grid-8,
            .grid-9,
            .grid-12,
            .grid-16 {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 900px) {

            .grid-4,
            .grid-6,
            .grid-8,
            .grid-9,
            .grid-12,
            .grid-16 {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .monitor-grid {
                grid-template-columns: 1fr !important;
            }
        }

        /* Video Card styling */
        .video-card {
            background: var(--card-color);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.25);
            transition: all var(--transition-speed);
        }

        .video-card.active-focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.2);
        }

        .card-header {
            padding: 0.6rem 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid var(--glass-border);
            z-index: 5;
        }

        .card-title-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            flex: 1;
            margin-right: 0.5rem;
        }

        .card-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--live-color);
            box-shadow: 0 0 6px var(--live-color);
        }

        .card-status-dot.offline {
            background: #ffa800;
            box-shadow: 0 0 6px #ffa800;
        }

        .card-num {
            font-size: 0.75rem;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            padding: 0.1rem 0.35rem;
            border-radius: 4px;
        }

        .card-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-title-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--accent-color);
            color: white;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0;
            width: 100%;
            outline: none;
            display: none;
        }

        .card-actions {
            display: flex;
            gap: 0.4rem;
        }

        .card-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0.2rem;
            border-radius: 4px;
            transition: all var(--transition-speed);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.08);
        }

        .card-btn.delete:hover {
            color: var(--accent-color);
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #020204;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Overlay Placeholder */
        .video-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            color: var(--text-secondary);
            background: #07070a;
            font-size: 0.8rem;
            z-index: 2;
            cursor: pointer;
            transition: background var(--transition-speed);
        }

        .video-placeholder:hover {
            background: #0d0d12;
            color: var(--text-primary);
        }

        .video-placeholder svg {
            width: 32px;
            height: 32px;
            opacity: 0.4;
            transition: opacity var(--transition-speed);
        }

        .video-placeholder:hover svg {
            opacity: 0.8;
        }

        /* Individual Card bottom settings bar (Collapsible) */
        .card-footer {
            padding: 0.5rem;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 0.4rem;
        }

        /* Animation utilities */
        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.3);
                opacity: 0.5;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.01);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.25);
        }
    </style>
</head>

<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="app-container">
        <!-- Sidebar controls & Preset panels -->
        <aside class="sidebar">
            <div class="logo-area">
                <h1>Global Monitor Center</h1>
                <p>세계 거리 실시간 CCTV 통합 대시보드</p>
            </div>

            <div class="status-panel">
                <div class="badge">
                    <div class="dot"></div>
                    <span>LIVE</span>
                </div>
                <div class="badge">
                    <span style="color: var(--text-secondary)">접속수:</span>
                    <span id="visitorCount" style="color: white; font-weight: 600;">0</span>
                </div>
                <div class="badge">
                    <span style="color: var(--text-secondary)">스트림:</span>
                    <span id="activeCount" style="color: white; font-weight: 600;">0/8</span>
                </div>
            </div>

            <!-- Global Configuration Panel -->
            <div class="settings-section">
                <div class="section-title">
                    <span>시스템 전역 설정</span>
                </div>
                <div class="control-group">
                    <div class="form-row">
                        <label for="gridSize">모니터링 화면 수</label>
                        <select id="gridSize" onchange="changeGridSize(this.value)">
                            <option value="2">2 화면 (Dual View)</option>
                            <option value="4">4 화면 (Quad View)</option>
                            <option value="6">6 화면 (Hexa View)</option>
                            <option value="8" selected>8 화면 (Standard View)</option>
                            <option value="9">9 화면 (Square View)</option>
                            <option value="12">12 화면 (Multi View)</option>
                            <option value="16">16 화면 (Pro View)</option>
                        </select>
                    </div>

                    <div class="btn-grid">
                        <button class="btn-outline" onclick="refreshAllStreams()" title="모든 화면 동영상 다시 불러오기">
                            <svg width="12" height="12" fill="currentColor" viewBox="0 0 16 16">
                                <path fill-rule="evenodd"
                                    d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z" />
                                <path
                                    d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z" />
                            </svg>
                            전체 새로고침
                        </button>
                        <button class="btn-outline btn-accent" onclick="resetAllConfig()" title="기본 스트림 상태로 초기화">
                            초기화
                        </button>
                    </div>
                </div>
            </div>

            <!-- Focus / Slot Edit Panel -->
            <div class="settings-section">
                <div class="section-title">
                    <span>선택된 슬롯 상세 설정</span>
                </div>
                <div class="control-group active-slot-panel">
                    <div class="form-row">
                        <label>슬롯 인덱스</label>
                        <input type="text" id="editSlotIndex" readonly
                            style="color: var(--accent-color); font-weight: bold; background: rgba(255, 0, 85, 0.05); text-align: center; border-color: var(--glass-border-active);">
                    </div>
                    <div class="form-row">
                        <label for="editSlotTitle">슬롯 타이틀</label>
                        <input type="text" id="editSlotTitle" placeholder="예: 시부야 사거리"
                            oninput="syncActiveTitle(this.value)">
                    </div>
                    <div class="form-row">
                        <label for="editSlotUrl">YouTube 라이브 URL</label>
                        <input type="text" id="editSlotUrl" placeholder="https://www.youtube.com/watch?v=..."
                            oninput="syncActiveUrl(this.value)">
                    </div>
                    <button class="btn-outline" style="width: 100%; border-color: var(--accent-blue);"
                        onclick="saveActiveSlot()">
                        설정 저장
                    </button>
                </div>
            </div>

            <!-- Famous World Street CCTV Preset Library -->
            <div class="settings-section">
                <div class="section-title">
                    <span>글로벌 인기 CCTV 프리셋</span>
                </div>
                <div class="preset-list" id="presetList">
                    <!-- Loaded dynamically via js -->
                </div>
            </div>
        </aside>

        <!-- Main Dashboard Viewport -->
        <main class="main-content">
            <div class="grid-header">
                <h2>CCTV LIVE VIEWGRID</h2>
                <div style="font-size: 0.8rem; color: var(--text-secondary); display: flex; gap: 0.8rem;">
                    <span>* 슬롯을 클릭하면 해당 슬롯의 상세 정보를 왼쪽에서 편집할 수 있습니다.</span>
                </div>
            </div>

            <div class="monitor-grid grid-8" id="videoGrid">
                <!-- Camera view containers generated dynamically -->
            </div>
        </main>
    </div>

    <script>
        // Default CCTV presets config
        const presets = [
            { name: "미국 뉴저지 씨사이드 하이츠 해변", url: "https://www.youtube.com/watch?v=GEzXE5Wo4MI" },
            { name: "미국 볼티모어 아쿠아리움 수족관", url: "https://www.youtube.com/watch?v=KSxc-N67TU4" },
            { name: "earthTV 세계 실시간 라이브", url: "https://www.youtube.com/watch?v=HfgIFGbdGJ0" },
            { name: "영국 런던 애비로드 횡단보도", url: "https://www.youtube.com/watch?v=M3EYAY2MftI" },
            { name: "태국 코팡안 샌스카라 해변", url: "https://www.youtube.com/watch?v=FBYUkqutqzE" },
            { name: "핀란드 산타클로스 빌리지", url: "https://www.youtube.com/watch?v=Cp4RRAEgpeU" },
            { name: "미국 라스베이거스 벨라지오 온실", url: "https://www.youtube.com/watch?v=KJuGU7v5oYw" },
            { name: "MBC 실시간 뉴스 라이브", url: "https://www.youtube.com/watch?v=HIQELpUBf3w" }
        ];

        // Standard default slot database
        const defaultUrls = [
            "https://www.youtube.com/watch?v=GEzXE5Wo4MI",
            "https://www.youtube.com/watch?v=KSxc-N67TU4",
            "https://www.youtube.com/watch?v=HfgIFGbdGJ0",
            "https://www.youtube.com/watch?v=M3EYAY2MftI",
            "https://www.youtube.com/watch?v=FBYUkqutqzE",
            "https://www.youtube.com/watch?v=Cp4RRAEgpeU",
            "https://www.youtube.com/watch?v=KJuGU7v5oYw",
            "https://www.youtube.com/watch?v=HIQELpUBf3w"
        ];

        const defaultTitles = [
            "미국 뉴저지 씨사이드 하이츠 해변",
            "미국 볼티모어 아쿠아리움 수족관",
            "earthTV 세계 실시간 라이브",
            "영국 런던 애비로드 횡단보도",
            "태국 코팡안 샌스카라 해변",
            "핀란드 산타클로스 빌리지",
            "미국 라스베이거스 벨라지오 온실",
            "MBC 실시간 뉴스 라이브"
        ];

        let currentActiveSlotIndex = 0;
        let cctvStreams = [];
        let totalGridCount = 8;

        // Extract Video ID
        function extractVideoID(url) {
            if (!url) return null;
            const regExp = /^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#&?]*).*/;
            const liveRegExp = /youtube\.com\/live\/([^#&?]*)/;

            let match = url.match(regExp);
            if (match && match[7].length === 11) return match[7];

            match = url.match(liveRegExp);
            if (match && match[1].length === 11) return match[1];

            return null;
        }

        // Initialize streams array from localstorage or defaults
        function initData() {
            // Load grid size
            const savedSize = localStorage.getItem('grid_size');
            totalGridCount = savedSize ? parseInt(savedSize) : 8;
            document.getElementById('gridSize').value = totalGridCount.toString();

            // Load slots
            const savedStreams = localStorage.getItem('cctv_streams_v4');
            let parsedStreams = null;
            if (savedStreams) {
                try {
                    parsedStreams = JSON.parse(savedStreams);
                } catch (e) {
                    parsedStreams = null;
                }
            }

            if (parsedStreams) {
                cctvStreams = parsedStreams;
            }

            // Fallback fill
            for (let i = 0; i < 16; i++) {
                if (!cctvStreams[i]) {
                    cctvStreams[i] = {
                        title: defaultTitles[i % defaultTitles.length] + ` (Slot ${i + 1})`,
                        url: defaultUrls[i % defaultUrls.length] || ""
                    };
                }
            }
            saveData();
        }

        function saveData() {
            localStorage.setItem('cctv_streams_v4', JSON.stringify(cctvStreams));
            localStorage.setItem('grid_size', totalGridCount.toString());
            updateLiveStats();
        }

        function updateLiveStats() {
            let active = 0;
            for (let i = 0; i < totalGridCount; i++) {
                if (cctvStreams[i] && extractVideoID(cctvStreams[i].url)) {
                    active++;
                }
            }
            document.getElementById('activeCount').textContent = `${active}/${totalGridCount}`;
        }

        // Load Preset list items
        function renderPresetLibrary() {
            const list = document.getElementById('presetList');
            list.innerHTML = "";
            presets.forEach(p => {
                const item = document.createElement('div');
                item.className = 'preset-item';
                item.onclick = () => applyPresetToActive(p.name, p.url);
                item.innerHTML = `
                    <span class="loc">${p.name}</span>
                    <span class="action">슬롯 적용 →</span>
                `;
                list.appendChild(item);
            });
        }

        // Generate the monitors in grid
        function renderGrid() {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = "";

            // Set grid CSS class
            grid.className = `monitor-grid grid-${totalGridCount}`;

            for (let i = 0; i < totalGridCount; i++) {
                const stream = cctvStreams[i];
                const card = document.createElement('div');
                card.className = `video-card ${i === currentActiveSlotIndex ? 'active-focus' : ''}`;
                card.id = `card${i}`;
                card.onclick = (e) => {
                    // Prevent triggering if clicked on inner controls or input elements
                    if (e.target.closest('.card-actions') || e.target.closest('.card-footer') || e.target.tagName === 'INPUT') return;
                    setActiveSlot(i);
                };

                const videoId = extractVideoID(stream.url);
                let iframeMarkup = "";
                let placeholderMarkup = "";

                if (videoId) {
                    // Standard embed query params: muted by default, autoplay, loop
                    iframeMarkup = `<iframe id="iframe${i}" src="https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&loop=1&playlist=${videoId}&controls=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                } else {
                    placeholderMarkup = `
                        <div class="video-placeholder" onclick="setActiveSlot(${i})">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
                                <line x1="7" y1="2" x2="7" y2="22"></line>
                                <line x1="17" y1="2" x2="17" y2="22"></line>
                                <line x1="2" y1="12" x2="22" y2="12"></line>
                                <line x1="2" y1="7" x2="7" y2="7"></line>
                                <line x1="2" y1="17" x2="7" y2="17"></line>
                                <line x1="17" y1="17" x2="22" y2="17"></line>
                                <line x1="17" y1="7" x2="22" y2="7"></line>
                            </svg>
                            <span>CCTV 영상 연결이 해제되었습니다</span>
                            <span style="font-size:0.7rem; color:var(--accent-blue)">눌러서 라이브 링크 입력하기</span>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-title-group" onclick="enableTitleEdit(${i})">
                            <div class="card-status-dot ${videoId ? '' : 'offline'}"></div>
                            <span class="card-num">#${i + 1}</span>
                            <span class="card-title" id="cardTitleText${i}">${stream.title || '채널 없음'}</span>
                            <input type="text" class="card-title-input" id="cardTitleInput${i}" value="${stream.title || ''}" onblur="saveTitleDirect(${i})" onkeypress="handleTitleKeyPress(event, ${i})">
                        </div>
                        <div class="card-actions">
                            <button class="card-btn" onclick="refreshSlot(${i})" title="슬롯 새로고침">
                                <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
                            </button>
                            <button class="card-btn delete" onclick="clearSlot(${i})" title="슬롯 비우기">
                                <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                            </button>
                        </div>
                    </div>
                    <div class="video-wrapper">
                        ${iframeMarkup}
                        ${placeholderMarkup}
                    </div>
                    <div class="card-footer">
                        <input type="text" id="slotUrlInput${i}" value="${stream.url}" placeholder="유튜브 링크 입력" onkeypress="handleUrlKeyPress(event, ${i})">
                        <button class="btn-accent" style="padding: 0.3rem 0.6rem; font-size: 0.75rem;" onclick="updateSlotUrlDirect(${i})">변경</button>
                    </div>
                `;
                grid.appendChild(card);
            }
            updateLiveStats();
        }

        // Active slot state setting
        function setActiveSlot(index) {
            // Remove active focus highlights
            document.querySelectorAll('.video-card').forEach(el => el.classList.remove('active-focus'));

            currentActiveSlotIndex = index;
            const activeCard = document.getElementById(`card${index}`);
            if (activeCard) {
                activeCard.classList.add('active-focus');
            }

            // Sync the detailed config panel
            document.getElementById('editSlotIndex').value = `Slot #${index + 1}`;
            document.getElementById('editSlotTitle').value = cctvStreams[index].title || "";
            document.getElementById('editSlotUrl').value = cctvStreams[index].url || "";
        }

        function syncActiveTitle(val) {
            cctvStreams[currentActiveSlotIndex].title = val;
            const txtNode = document.getElementById(`cardTitleText${currentActiveSlotIndex}`);
            if (txtNode) txtNode.textContent = val || "채널 없음";

            const inpNode = document.getElementById(`cardTitleInput${currentActiveSlotIndex}`);
            if (inpNode) inpNode.value = val;
        }

        function syncActiveUrl(val) {
            cctvStreams[currentActiveSlotIndex].url = val;
            const inputDirect = document.getElementById(`slotUrlInput${currentActiveSlotIndex}`);
            if (inputDirect) inputDirect.value = val;
        }

        // Direct url box change
        function updateSlotUrlDirect(index) {
            const inputEl = document.getElementById(`slotUrlInput${index}`);
            if (inputEl) {
                cctvStreams[index].url = inputEl.value.trim();
                saveData();
                renderGrid();
                setActiveSlot(index);
            }
        }

        function handleUrlKeyPress(e, index) {
            if (e.key === 'Enter') {
                updateSlotUrlDirect(index);
            }
        }

        function saveActiveSlot() {
            saveData();
            // Reload the changed card specifically
            const stream = cctvStreams[currentActiveSlotIndex];
            const videoId = extractVideoID(stream.url);
            const card = document.getElementById(`card${currentActiveSlotIndex}`);

            if (card) {
                renderGrid(); // Easy full refresh to maintain bindings
                setActiveSlot(currentActiveSlotIndex);
            }
        }

        function applyPresetToActive(name, url) {
            cctvStreams[currentActiveSlotIndex].title = name;
            cctvStreams[currentActiveSlotIndex].url = url;
            saveData();
            renderGrid();
            setActiveSlot(currentActiveSlotIndex);
        }

        // Grid Size dropdown change
        function changeGridSize(size) {
            totalGridCount = parseInt(size);
            if (currentActiveSlotIndex >= totalGridCount) {
                currentActiveSlotIndex = 0;
            }
            saveData();
            renderGrid();
            setActiveSlot(currentActiveSlotIndex);
        }

        // Quick title edit toggles inside card
        function enableTitleEdit(index) {
            const textEl = document.getElementById(`cardTitleText${index}`);
            const inputEl = document.getElementById(`cardTitleInput${index}`);
            if (textEl && inputEl) {
                textEl.style.display = "none";
                inputEl.style.display = "inline-block";
                inputEl.focus();
            }
        }

        function saveTitleDirect(index) {
            const textEl = document.getElementById(`cardTitleText${index}`);
            const inputEl = document.getElementById(`cardTitleInput${index}`);
            if (textEl && inputEl) {
                const newTitle = inputEl.value.trim() || `Slot #${index + 1}`;
                cctvStreams[index].title = newTitle;
                textEl.textContent = newTitle;
                textEl.style.display = "inline-block";
                inputEl.style.display = "none";
                saveData();
                if (index === currentActiveSlotIndex) {
                    document.getElementById('editSlotTitle').value = newTitle;
                }
            }
        }

        function handleTitleKeyPress(e, index) {
            if (e.key === 'Enter') {
                saveTitleDirect(index);
            }
        }

        // Slot operation icons
        function refreshSlot(index) {
            const iframe = document.getElementById(`iframe${index}`);
            if (iframe) {
                const src = iframe.src;
                iframe.src = "";
                // Slight delay to simulate security feed reconnecting
                setTimeout(() => {
                    iframe.src = src;
                }, 200);
            }
        }

        function clearSlot(index) {
            cctvStreams[index].url = "";
            cctvStreams[index].title = `Slot #${index + 1}`;
            saveData();
            renderGrid();
            setActiveSlot(index);
        }

        // Global Batch operations
        function refreshAllStreams() {
            for (let i = 0; i < totalGridCount; i++) {
                refreshSlot(i);
            }
        }

        function resetAllConfig() {
            if (confirm("정말 모든 설정을 처음 상태로 되돌리시겠습니까?")) {
                localStorage.removeItem('cctv_streams_v4');
                localStorage.removeItem('grid_size');
                initData();
                renderGrid();
                setActiveSlot(0);
            }
        }

        // Visitor counter simulation
        function initVisitorCounter() {
            let count = localStorage.getItem('global_cctv_visitors') || 0;
            count = parseInt(count) + 1;
            localStorage.setItem('global_cctv_visitors', count);
            document.getElementById('visitorCount').textContent = count.toLocaleString();
        }

        // Setup dashboard sequence
        function initDashboard() {
            initVisitorCounter();
            initData();
            renderPresetLibrary();
            renderGrid();
            setActiveSlot(0);
        }

        window.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>

</html>
